# SolarTech: a native trait mod (Horizon docs/native-mods.md, "Trait mods").
# It gives the blocks the content mod of the same id declares (solar panel, energy
# cable, electric furnace) their block entities, their energy and their screens.
[mod]
id = "solartech"
version = "0.2.1"

# The Horizon source the launcher builds the game from (main, 2026-11-12). Nightly
# 2026-11-08 (fdc87ae) doesn't build with launcher 0.2.62: see build.sh.
[compatibility]
horizon_revision = "4acdda54f2ef1e44ade292ce3b02ed91910f9f83"

[api]
path = "api"
